<article class="professional-card article-card">{% if article.cover_image %}<a href="{{ article.get_absolute_url }}" class="card-media"><img src="{{ article.cover_image.url }}" alt="{{ article.cover_image_alt|default:article.title }}" loading="lazy"></a>{% else %}<div class="card-placeholder"><i class="bi bi-journal-text"></i></div>{% endif %}<div class="card-body"><div class="meta"><span>{{ article.category }}</span><time datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|date:"M j, Y" }}</time></div><h3><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3><p>{{ article.excerpt|truncatewords:24 }}</p><a class="text-link" href="{{ article.get_absolute_url }}">Read article <i class="bi bi-arrow-right"></i></a></div></article>
