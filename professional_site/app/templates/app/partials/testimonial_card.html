<figure class="professional-card testimonial-card"><blockquote>{{ testimonial.quote|linebreaksbr }}</blockquote><figcaption>{% if testimonial.photo %}<img src="{{ testimonial.photo.url }}" alt="{{ testimonial.person_name }}" loading="lazy">{% else %}<span class="avatar-fallback">{{ testimonial.person_name|first }}</span>{% endif %}<div><strong>{{ testimonial.person_name }}</strong><span>{{ testimonial.person_title }}{% if testimonial.organization %}{% if testimonial.person_title %}, {% endif %}{{ testimonial.organization }}{% endif %}</span></div></figcaption></figure>
