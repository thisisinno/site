<article class="professional-card project-card">{% if project.image %}<a href="{{ project.get_absolute_url }}" class="card-media"><img src="{{ project.image.url }}" alt="{{ project.image_alt|default:project.title }}" loading="lazy"></a>{% else %}<div class="card-placeholder"><i class="bi bi-people"></i></div>{% endif %}<div class="card-body"><div class="meta"><span>{{ project.category }}</span><span>{{ project.status }}</span></div><h3><a href="{{ project.get_absolute_url }}">{{ project.title }}</a></h3>{% if project.role %}<p class="role">{{ project.role }}</p>{% endif %}<p>{{ project.summary|truncatewords:25 }}</p><a class="text-link" href="{{ project.get_absolute_url }}">View project <i class="bi bi-arrow-right"></i></a></div></article>
